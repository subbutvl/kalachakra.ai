name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Type check, lint and test
        run: pnpm check

      - name: Lichun table is reproducible
        run: |
          pnpm --filter @kalachakra/rules gen:lichun
          git diff --exit-code packages/rules/v1.0/kua.json
